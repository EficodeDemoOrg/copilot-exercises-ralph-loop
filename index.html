<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f3f7" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#07080b" media="(prefers-color-scheme: dark)" />
  <title>Reminders</title>
</head>

<body>
  <main class="app-shell">
    <section class="todo-card" aria-labelledby="app-title">
      <header class="todo-header">
        <h1 id="app-title" class="todo-title">Reminders</h1>
        <p class="todo-subtitle" id="items-left">0 items left</p>
      </header>

      <form id="add-form" class="add-form" autocomplete="off">
        <label for="todo-input" class="visually-hidden">New reminder</label>
        <input id="todo-input" type="text" placeholder="Add a new reminder…" spellcheck="true"
          autocapitalize="sentences" />
        <label for="todo-category" class="visually-hidden">Category</label>
        <select id="todo-category" class="category-select" aria-label="Category">
          <option value="Uncategorized" selected>Uncategorized</option>
          <option value="Work">Work</option>
          <option value="Home">Home</option>
          <option value="Hobbies">Hobbies</option>
        </select>
        <button id="add-btn" class="add-btn" type="submit" aria-label="Add reminder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
            stroke-linejoin="round" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
        </button>
      </form>

      <div class="filter-tabs" role="tablist" aria-label="Filter reminders">
        <button class="filter-tab" type="button" role="tab" aria-selected="true" data-filter="all">All</button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false" data-filter="active">Active</button>
        <button class="filter-tab" type="button" role="tab" aria-selected="false"
          data-filter="completed">Completed</button>
      </div>

      <div class="category-filter" role="tablist" aria-label="Filter by category">
        <button class="category-filter-tab" type="button" role="tab" aria-selected="true"
          data-category="all">All</button>
        <button class="category-filter-tab" type="button" role="tab" aria-selected="false"
          data-category="Work">Work</button>
        <button class="category-filter-tab" type="button" role="tab" aria-selected="false"
          data-category="Home">Home</button>
        <button class="category-filter-tab" type="button" role="tab" aria-selected="false"
          data-category="Hobbies">Hobbies</button>
        <button class="category-filter-tab" type="button" role="tab" aria-selected="false"
          data-category="Uncategorized">Uncategorized</button>
      </div>

      <ul id="todo-list" class="todo-list" aria-label="Reminders"></ul>

      <footer class="todo-footer">
        <span class="items-left" aria-hidden="true"></span>
        <button id="clear-completed" class="clear-completed" type="button">Clear completed</button>
      </footer>
    </section>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
